<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/stars.css">
    <link rel="shortcut icon" href="./assets/icons8-death-star-96.png" type="image/x-icon">
    
    <title>My Disney Universe</title>
</head>
<body onload="init()">
     <div aria-hidden class="stars-wrapper">
      <div id="stars"></div>
      <div id="stars2"></div>
      <div id="stars3"></div>
    </div>
<header>
        
        <h1>My Disney Universe</h1>
        <div class="header-img-wrapper"><img src="./assets/icons8-death-star-100.png" alt="death-star"></div> 
        <div id="search-section" class="search-section">
            <input type="text" name="disney-charcter" id="search-input-field" class="search-input-field" placeholder="Search for any Disney character">
            <button type="submit" class="submit-search-btn" onclick="searchCharacter()">Go!</button>
        </div>
        
</header>
<main>

    <section id="error-message">

    </section>

    <ul role="list" id="character-list" class="character-list"></ul>
    
    <div id="load-more-btn-container"></div>



</main>

<footer>
    <div class="footer-link-wrapper">
        <a target="_blank" href="https://icons8.com/icon/124329/death-star">Death Star</a><p> icon by </p><a target="_blank" href="https://icons8.com">Icons8</a>
    </div>
    <div class="footer-img-wrapper"><img src="./assets/icons8-death-star-100.png" alt="death-star"></div>
</footer>

</body>
<script src="./script.js"></script>
</html>
